name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode le plus récent
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Génération du projet Xcode (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      # Facultatif : config Firebase (secret GOOGLE_SERVICE_INFO_PLIST = contenu du fichier encodé en base64)
      - name: Config Firebase
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$PLIST_B64" ]; then echo "$PLIST_B64" | base64 --decode > Stalium/GoogleService-Info.plist; echo "Firebase configuré"; else echo "Pas de config Firebase (push désactivées)"; fi

      - name: Compilation (simulateur, sans signature)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Stalium.xcodeproj -scheme Stalium \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Erreurs de compilation
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -60 || true
